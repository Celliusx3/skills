[project]
name = "comic-translator"
version = "0.1.0"
description = "The comic-translator skill's script: detect the text on comic pages, then clean and letter them from the notes"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2.6,<3", "pillow>=11.3.0,<14", "onnxruntime>=1.22.1,<2", "scipy>=1.15.3,<2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.1"]

[tool.pytest.ini_options]
addopts = "--cov=comic_translator --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["."]
testpaths = ["comic_translator/tests"]

[tool.coverage.run]
omit = ["comic_translator/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["comic_translator"]
